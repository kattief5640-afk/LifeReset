<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeReset</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">LifeReset</div>
    <div class="tagline">You don't have to figure everything out alone.</div>
  </header>

  <main>
    <section class="welcome-card">
      <h1>Welcome to LifeReset</h1>

      <p>
        Whatever you're carrying today, you don't have to hide it here.
        Take a breath. Tell us what's on your mind.
      </p>

      <button id="beginButton">Let's begin</button>
    </section>
    <section id="checkin" style="display: none;">
      <h2>I'm glad you're here.</h2>
      <p>You can take your time. Tell me how you're really doing today.</p>

      <textarea id="feelingInput" placeholder="Write what's on your mind..."></textarea>

      <button id="continueButton">Continue</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
