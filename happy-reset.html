/* =========================
   LANGUAGE
========================= */

const language =
  localStorage.getItem("lifeResetLanguage") || "en";

const t = translations[language] || translations.en;

document.documentElement.lang = language;


/* =========================
   MAIN PAGE TEXT
========================= */

document.getElementById("tagline").textContent = t.tagline;
document.getElementById("happyResetHeading").textContent = t.heading;
document.getElementById("happyIntro").textContent = t.intro;
document.getElementById("happyQuestion").textContent = t.question;

document.getElementById("celebrateButton").textContent = t.celebrate;
document.getElementById("saveFeelingButton").textContent = t.saveFeeling;
document.getElementById("buildOnItButton").textContent = t.build;
document.getElementById("connectButton").textContent = t.connect;
document.getElementById("enjoyButton").textContent = t.enjoy;

document.getElementById("happyBackButton").textContent = t.back;


/* =========================
   ELEMENTS
========================= */

const celebrateButton =
  document.getElementById("celebrateButton");

const saveFeelingButton =
  document.getElementById("saveFeelingButton");

const buildOnItButton =
  document.getElementById("buildOnItButton");

const connectButton =
  document.getElementById("connectButton");

const enjoyButton =
  document.getElementById("enjoyButton");

const resetOptions =
  document.querySelector(".reset-options");

const happyContent =
  document.getElementById("happyContent");

const happyTitle =
  document.getElementById("happyTitle");

const happyText =
  document.getElementById("happyText");

const happyArea =
  document.getElementById("happyArea");

const happyBackButton =
  document.getElementById("happyBackButton");


function showHappyContent(title, text, content) {

  resetOptions.style.display = "none";

  happyContent.style.display = "block";

  happyTitle.textContent = title;

  happyText.textContent = text;

  happyArea.innerHTML = content;

}


/* =========================
   CELEBRATE
========================= */

celebrateButton.addEventListener("click", function () {

  showHappyContent(
    t.celebrateTitle,
    t.celebrateText,
    `
      <p>${t.celebrateP1}</p>

      <p>${t.celebrateP2}</p>

      <textarea
        id="celebrationInput"
        rows="6"
        placeholder="${t.celebratePlaceholder}"
      ></textarea> <button id="saveCelebrationButton">
    ${t.saveReflection}
  </button>

  <p id="celebrationMessage"></p>
`

);

document.getElementById("saveCelebrationButton")
.addEventListener("click", function () {

  const input =
    document.getElementById("celebrationInput");

  const message =
    document.getElementById("celebrationMessage");

  const reflection =
    input.value.trim();

  if (reflection === "") {

    message.textContent =
      t.reflectionEmpty;

    return;
  }

  localStorage.setItem(
    "lifeResetCelebration",
    reflection
  );

  message.textContent =
    t.reflectionSaved;

});

});

/* =========================
SAVE THIS FEELING
========================= */

saveFeelingButton.addEventListener("click", function () {

const feeling =
localStorage.getItem("lifeResetFeeling");

showHappyContent(
t.saveTitle,
t.saveText,
`
<p>
${
feeling
? t.feelingWritten + " <strong>" + feeling + "</strong>"
: t.feelingFallback
}
</p>

  <textarea
    id="savedFeelingInput"
    rows="6"
    placeholder="${t.savePlaceholder}"
  ></textarea>

  <button id="saveFeelingNoteButton">
    ${t.saveButton}
  </button>

  <p id="savedFeelingMessage"></p>
`

);

document.getElementById("saveFeelingNoteButton")
.addEventListener("click", function () {

  const input =
    document.getElementById("savedFeelingInput");

  const message =
    document.getElementById("savedFeelingMessage");

  const note =
    input.value.trim();

  if (note === "") {

    message.textContent =
      t.saveEmpty;

    return;
  }

  localStorage.setItem(
    "lifeResetHappyNote",
    note
  );

  message.textContent =
    t.saved;

});

});

/* =========================

========================= */

buildOnItButton.addEventListener("click", function () {

t.buildTitle,
t.buildText,

<li>${t.creative}</li>
<li>${t.music}</li>
<li>${t.goal}</li>
<li>${t.kindness}</li>
</ul>

  <p>${t.buildEnd}</p>
`

);

});

/* =========================

========================= */

connectButton.addEventListener("click", function () {

showHappyContent(
t.connectTitle,
t.connectText,
`
<p>${t.connectP1}</p>

  <p>${t.connectP2}</p>

  <p>
    <strong>${t.connectMessage}</strong>
  </p>

  <p>${t.connectEnd}</p>
`

);

});

JUST ENJOY IT
========================= */

<p>${t.enjoyP1}</p>

  <p>${t.enjoyP2}</p>

  <p>
    <strong>${t.enjoyEnd}</strong>
  </p>
`

);

});

/* =========================
BACK TO RESET
========================= */

happyBackButton.addEventListener("click", function () {

happyContent.style.display = "none";

resetOptions.style.display = "block";

});
