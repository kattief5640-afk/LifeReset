<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeReset - Happy Reset</title>
  <link rel="stylesheet" href="style.css">
</head><body> <header>
    <div class="logo">LifeReset</div>
    <div class="tagline">You don't have to figure everything out alone.</div>
  </header> <main>
    <section class="welcome-card"> <h1>😊 Here's Your Reset</h1>

  <p>
    You're in a good place right now. Let's enjoy this moment
    and carry some of that positive feeling forward.
  </p>

  <h2>What would feel good right now?</h2>

  <button onclick="alert('Take a moment to celebrate what is going well. You deserve to enjoy this moment.')">
    🎉 Celebrate This Moment
  </button>

  <button onclick="alert('Write down what is making you feel good today. You can come back to it whenever you need a reminder.')">
    📝 Save This Feeling
  </button>

  <button onclick="alert('Choose one small thing you can do today that keeps your positive momentum going.')">
    💪 Build On It
  </button>

  <button onclick="alert('Reach out to someone you care about. Share the good energy.')">
    ❤️ Connect With Someone
  </button>

  <button onclick="alert('You don't have to accomplish anything right now. Sometimes the reset is simply enjoying the moment.')">
    🌿 Just Enjoy It
  </button>

</section>

  </main></body>
</html>
