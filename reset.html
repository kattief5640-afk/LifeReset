<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeReset - Your Reset</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">LifeReset</div>
    <div class="tagline">You don't have to figure everything out alone.</div>
  </header>

  <main>
    <section class="welcome-card">

      <h1>Let's take your next step.</h1>

      <p id="resetIntro">
        You don't have to fix everything today.
        Let's focus on one small step that can help you feel a little better.
      </p>

      <button id="resetButton">Show Me My Reset</button>

      <div id="resetMessage"></div>

      <div id="nextChoices" style="display: none;">

        <h3>What would help you right now?</h3>

        <button class="choiceButton">Calm me down</button>
        <button class="choiceButton">Give me motivation</button>
        <button class="choiceButton">I need support</button>
        <button class="choiceButton">Help me make a plan</button>

      </div>

    </section>
  </main>

  <script>
   const resetButton = document.getElementById("resetButton");
   const resetMessage = document.getElementById("resetMessage");
   const nextChoices = document.getElementById("nextChoices");

resetButton.addEventListener("click", function () {

  const feeling = localStorage.getItem("lifeResetFeeling");
  const text = feeling ? feeling.toLowerCase() : "";

  let message = "";

  if (text.includes("tired") || text.includes("exhausted")) {

    message = `
      <h2>Rest & Recharge</h2>
      <p>It sounds like your energy is low today.</p>
      <p><strong>Your small reset:</strong> Give yourself 10 quiet minutes. Sit somewhere comfortable, breathe slowly, and allow yourself to pause without feeling guilty.</p>
    `;

  } else if (text.includes("overwhelmed") || text.includes("too much")) {

    message = `
      <h2>Pause & Simplify</h2>
      <p>You don't have to handle everything at once.</p>
      <p><strong>Your small reset:</strong> Choose just one thing that needs your attention right now. Everything else can wait.</p>
    `;

  } else if (text.includes("sad") || text.includes("lonely")) {

    message = `
      <h2>Be Gentle With Yourself</h2>
      <p>You don't have to pretend you're okay when you're having a hard day.</p>
      <p><strong>Your small reset:</strong> Take a few slow breaths and do one comforting thing for yourself today.</p>
    `;

  } else if (text.includes("angry") || text.includes("mad")) {

    message = `
      <h2>Pause & Release</h2>
      <p>You don't have to react while everything still feels intense.</p>
      <p><strong>Your small reset:</strong> Step away for a few minutes, breathe deeply, and give yourself space before deciding what to do next.</p>
    `;

  } else if (text.includes("stress") || text.includes("stressed")) {

    message = `
      <h2>Ground Yourself</h2>
      <p>Let's bring your attention back to this moment.</p>
      <p><strong>Your small reset:</strong> Take five slow breaths and notice what you can see and hear around you.</p>
    `;

  } else {

    message = `
      <h2>Here's Your Reset</h2>
      <p>Whatever you're carrying today, you don't have to solve everything right now.</p>
      <p><strong>Your small reset:</strong> Take one slow breath and choose one small thing you can do for yourself today.</p>
    `;
  }

  resetMessage.innerHTML = message;
  resetButton.style.display = "none";
  nextChoices.style.display = "block";
});


const choiceButtons = document.querySelectorAll(".choiceButton");

choiceButtons.forEach(function (button) {

  button.addEventListener("click", function () {

    const choice = button.textContent;

    if (choice === "Calm me down") {

      nextChoices.innerHTML = `
        <h3>Let's slow things down.</h3>

        <p>When you're ready, we'll take three slow breaths together.</p>

        <div id="breathingTimer" style="font-size: 40px; margin: 20px 0;">
          Ready
        </div>

        <button id="startBreathing">Start Breathing Exercise</button>
      `;

      const startBreathing = document.getElementById("startBreathing");
      const breathingTimer = document.getElementById("breathingTimer");

      startBreathing.addEventListener("click", function () {

        startBreathing.style.display = "none";

        let step = 0;
        let round = 1;
        let seconds = 0;

        const breathingSteps = [
          { text: "Breathe in slowly...", time: 4 },
          { text: "Hold...", time: 2 },
          { text: "Breathe out slowly...", time: 6 }
        ];

        function runBreathingStep() {

          if (step >= breathingSteps.length) {

  if (round < 3) {
    round++;
    step = 0;
    runBreathingStep();
    return;
  }

  nextChoices.innerHTML = `
    <h3>You did it. 🌱</h3>
    <p>You just completed three slow breaths.</p>
    <p>Take a moment and notice how you feel.</p>
  `;

  return;
}


          const currentStep = breathingSteps[step];
          seconds = currentStep.time;

          breathingTimer.innerHTML =
            currentStep.text + "<br>" + seconds;

          const timer = setInterval(function () {

            seconds--;

            if (seconds > 0) {
              breathingTimer.innerHTML =
                currentStep.text + "<br>" + seconds;
            } else {
              clearInterval(timer);
              step++;
              runBreathingStep();
            }

          }, 1000);
        }

        runBreathingStep();
      });

    } else if (choice === "Give me motivation") {

      nextChoices.innerHTML = `
        <h3>One small step is enough.</h3>
        <p>You don't have to finish everything today.</p>
        <p>Choose one thing you can start in the next 10 minutes.</p>
      `;

    } else if (choice === "I need support") {

      nextChoices.innerHTML = `
        <h3>You don't have to carry everything alone.</h3>
        <p>Think about someone you trust.</p>
        <p>If you're comfortable, reach out and simply say, "I could use someone to talk to."</p>
      `;

    } else if (choice === "Help me make a plan") {

      nextChoices.innerHTML = `
        <h3>Let's make it simple.</h3>
        <p><strong>Step 1:</strong> Choose one thing that needs your attention.</p>
        <p><strong>Step 2:</strong> Decide the smallest action you can take.</p>
        <p><strong>Step 3:</strong> Give yourself permission to stop after that step.</p>
      `;
    }

  });

}); 
  </script>

</body>
</html>
