    const language =
      localStorage.getItem("lifeResetLanguage") || "en";

    const t = translations[language] || translations.en;

    document.documentElement.lang = language;

    document.getElementById("tagline").textContent = t.tagline;
    document.getElementById("resetTitle").textContent = t.resetTitle;
    document.getElementById("resetIntro").textContent = t.resetIntro;
    document.getElementById("resetButton").textContent = t.resetButton;
    document.getElementById("choicesTitle").textContent = t.choicesTitle;


    const choiceButtons = document.querySelectorAll(".choiceButton");

    choiceButtons.forEach(function(button) {

      const choice = button.dataset.choice;

      if (choice === "calm") {
        button.textContent = t.calm;
      }

      if (choice === "motivation") {
        button.textContent = t.motivation;
      }

      if (choice === "support") {
        button.textContent = t.support;
      }

      if (choice === "plan") {
        button.textContent = t.plan;
      }

    });


    const resetButton = document.getElementById("resetButton");
    const resetMessage = document.getElementById("resetMessage");
    const nextChoices = document.getElementById("nextChoices");


    resetButton.addEventListener("click", function() {

      const feeling = localStorage.getItem("lifeResetFeeling");
      const text = feeling ? feeling.toLowerCase() : "";

      let message = "";

      if (text.includes("tired") || text.includes("exhausted")) {

        message = `
          <h2>${t.tiredTitle}</h2>
          <p>${t.tiredText}</p>
          <p><strong>Your small reset:</strong> ${t.tiredReset}</p>
        `;

      } else if (text.includes("overwhelmed") || text.includes("too much")) {

        message = `
          <h2>${t.overwhelmedTitle}</h2>
          <p>${t.overwhelmedText}</p>
          <p><strong>Your small reset:</strong> ${t.overwhelmedReset}</p>
        `;

      } else if (text.includes("sad") || text.includes("lonely")) {

        message = `
          <h2>${t.sadTitle}</h2>
          <p>${t.sadText}</p>
          <p><strong>Your small reset:</strong> ${t.sadReset}</p>
        `;

      } else if (text.includes("angry") || text.includes("mad")) {

        message = `
          <h2>${t.angryTitle}</h2>
          <p>${t.angryText}</p>
          <p><strong>Your small reset:</strong> ${t.angryReset}</p>
        `;

      } else if (text.includes("stress") || text.includes("stressed")) {

        message = `
          <h2>${t.stressTitle}</h2>
          <p>${t.stressText}</p>
          <p><strong>Your small reset:</strong> ${t.stressReset}</p>
        `;

      } else {

        message = `
          <h2>${t.defaultTitle}</h2>
          <p>${t.defaultText}</p>
          <p><strong>Your small reset:</strong> ${t.defaultReset}</p>
        `;
      }

      resetMessage.innerHTML = message;

      resetButton.style.display = "none";
      nextChoices.style.display = "block";

    });


    choiceButtons.forEach(function(button) {

      button.addEventListener("click", function() {

        const choice = button.dataset.choice;


        if (choice === "calm") {

          nextChoices.innerHTML = `
            <h3>${t.calmTitle}</h3>

            <p>${t.calmText}</p>

            <div id="breathingTimer" style="font-size: 40px; margin: 20px 0;">
              ${t.ready}
            </div>

            <button id="startBreathing">${t.startBreathing}</button>
          `;


          const startBreathing =
            document.getElementById("startBreathing");

          const breathingTimer =
            document.getElementById("breathingTimer");


          startBreathing.addEventListener("click", function() {

            startBreathing.style.display = "none";

            let step = 0;
            let round = 1;
            let seconds = 0;

            const breathingSteps = [
              { text: t.breatheIn, time: 4 },
              { text: t.hold, time: 2 },
              { text: t.breatheOut, time: 6 }
            ];


            function runBreathingStep() {

              if (step >= breathingSteps.length) {

                if (round < 3) {

                  round++;
                  step = 0;

                  runBreathingStep();

                  return;
                }


                nextChoices.innerHTML = `
                  <h3>${t.completeTitle}</h3>
                  <p>${t.completeText}</p>
                  <p>${t.completeNotice}</p>
                `;

                return;
              }


              const currentStep =
                breathingSteps[step];

              seconds = currentStep.time;


              breathingTimer.innerHTML =
                currentStep.text + "<br>" + seconds;


              const timer = setInterval(function() {

                seconds--;

                if (seconds > 0) {

                  breathingTimer.innerHTML =
                    currentStep.text + "<br>" + seconds;

                } else {

                  clearInterval(timer);

                  step++;

                  runBreathingStep();

                }

              }, 1000);

            }


            runBreathingStep();

          });


        } else if (choice === "motivation") {

          nextChoices.innerHTML = `
            <h3>${t.motivationTitle}</h3>
            <p>${t.motivationText}</p>
            <p>${t.motivationReset}</p>
          `;


        } else if (choice === "support") {

          nextChoices.innerHTML = `
            <h3>${t.supportTitle}</h3>
            <p>${t.supportText}</p>
            <p>${t.supportReset}</p>
          `;


        } else if (choice === "plan") {

          nextChoices.innerHTML = `
            <h3>${t.planTitle}</h3>

            <p><strong>Step 1:</strong> ${t.step1}</p>

            <p><strong>Step 2:</strong> ${t.step2}</p>

            <p><strong>Step 3:</strong> ${t.step3}</p>
          `;

        }

      });

    });
