<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeReset - Down Reset</title>
  <link rel="stylesheet" href="style.css">
</head><body> <header>
    <div class="logo">LifeReset</div>
    <div class="tagline">You don't have to figure everything out alone.</div>
  </header> <main><section class="welcome-card">

  <h1>🌧️ Here's Your Reset</h1>

  <p>
    You don't have to fix everything right now.
    Let's focus on one small step that can make this moment
    a little easier.
  </p>

  <h2>What do you need right now?</h2>

  <div class="reset-options">

    <button id="breathingButton">
      🌬️ Take a Breathing Break
    </button>

    <button id="journalButton">
      📝 Get It Off My Mind
    </button>

    <button id="smallThingButton">
      🌱 Do One Small Thing
    </button>

    <button id="movementButton">
      🚶 Move My Body
    </button>

    <button id="reachOutButton">
      ❤️ Reach Out
    </button>

    <button id="restButton">
      🛌 Give Myself Permission to Rest
    </button>

  </div>

  <div id="resetContent" class="reset-content" style="display: none;">

    <h2 id="contentTitle"></h2>

    <p id="contentText"></p>

    <div id="contentArea"></div>

    <button id="closeContentButton">
      Back to My Reset
    </button>

  </div>

</section>

  </main> <script>

    const breathingButton = document.getElementById("breathingButton");
    const journalButton = document.getElementById("journalButton");
    const smallThingButton = document.getElementById("smallThingButton");
    const movementButton = document.getElementById("movementButton");
    const reachOutButton = document.getElementById("reachOutButton");
    const restButton = document.getElementById("restButton");

    const resetOptions = document.querySelector(".reset-options");
    const resetContent = document.getElementById("resetContent");
    const contentTitle = document.getElementById("contentTitle");
    const contentText = document.getElementById("contentText");
    const contentArea = document.getElementById("contentArea");
    const closeContentButton = document.getElementById("closeContentButton");


    function showContent(title, text, content) {

      resetOptions.style.display = "none";

      resetContent.style.display = "block";

      contentTitle.textContent = title;

      contentText.textContent = text;

      contentArea.innerHTML = content;

    }


    breathingButton.addEventListener("click", function () {

      showContent(
        "🌬️ Take a Breathing Break",
        "Let's slow things down for a moment. Follow the rhythm below.",
        `
          <div>
            <h2 id="breathingTimer">Ready</h2>

            <p id="breathingInstruction">
              When you're ready, begin with a slow breath.
            </p>

            <button id="startBreathingButton">
              Start Breathing
            </button>
          </div>
        `
      );

      document.getElementById("startBreathingButton")
        .addEventListener("click", startBreathing);

    });


    function startBreathing() {

      const timer = document.getElementById("breathingTimer");
      const instruction = document.getElementById("breathingInstruction");
      const button = document.getElementById("startBreathingButton");

      button.style.display = "none";

      let step = 0;

      const breathingSteps = [
        ["Breathe in", 4],
        ["Hold", 4],
        ["Breathe out", 6]
      ];

      function nextStep() {

        if (step >= breathingSteps.length) {

          timer.textContent = "Done 🌱";

          instruction.textContent =
            "Take a moment to notice how you feel. You can repeat this exercise if you'd like.";

          return;
        }

        const currentStep = breathingSteps[step];

        instruction.textContent = currentStep[0];

        let seconds = currentStep[1];

        timer.textContent = seconds;

        const countdown = setInterval(function () {

          seconds--;

          timer.textContent = seconds;

          if (seconds <= 0) {

            clearInterval(countdown);

            step++;

            nextStep();

          }

        }, 1000);

      }

      nextStep();

    }


    journalButton.addEventListener("click", function () {

      showContent(
        "📝 Get It Off My Mind",
        "Put whatever is on your mind here. You don't have to make it perfect.",
        `
          <textarea
            id="journalInput"
            rows="8"
            placeholder="Write what's on your mind..."
          ></textarea> <button id="saveJournalButton">
        Save Entry
      </button>

      <p id="journalMessage"></p>
    `
  );

  const saveJournalButton = document.getElementById("saveJournalButton");

if (saveJournalButton) {
  saveJournalButton.addEventListener("click", function () {

    const journalInput = document.getElementById("journalInput");
    const journalMessage = document.getElementById("journalMessage");

    if (!journalInput || !journalMessage) {
      return;
    }

    const entry = journalInput.value.trim();

    if (entry === "") {
      journalMessage.textContent =
        "Write something first, even if it's just a few words.";
      return;
    }

    localStorage.setItem("lifeResetJournal", entry);

    journalMessage.textContent =
      "Your entry has been saved on this device. 🌱";

  });
}


smallThingButton.addEventListener("click", function () {

  showContent(
    "🌱 One Small Thing",
    "You don't have to do everything. Choose just one.",
    `
      <ul>
        <li>Drink a glass of water</li>
        <li>Take a shower</li>
        <li>Step outside for a few minutes</li>
        <li>Eat something nourishing</li>
        <li>Tidy one small area</li>
        <li>Put your phone down and take a quiet moment</li>
      </ul>
    `
  );

});


movementButton.addEventListener("click", function () {

  showContent(
    "🚶 Move My Body",
    "You don't need a workout. A little movement is enough.",
    `
      <ul>
        <li>Stretch your arms and shoulders</li>
        <li>Take a short walk</li>
        <li>Stretch your legs</li>
        <li>Dance to one song</li>
        <li>Take a few slow breaths while moving</li>
      </ul>
    `
  );

});


reachOutButton.addEventListener("click", function () {

  showContent(
    "❤️ Reach Out",
    "You don't have to handle everything alone.",
    `
      <p>Think of one person who makes you feel safe, supported, or understood.</p>

      <p>You don't need a long explanation. You can simply say:</p>

      <p><strong>"I'm having a hard day. Can we talk?"</strong></p>

      <p>Or:</p>

      <p><strong>"I could use some company right now."</strong></p>
    `
  );

});


restButton.addEventListener("click", function () {

  showContent(
    "🛌 Give Myself Permission to Rest",
    "Rest is allowed. You don't have to earn the right to take a break.",
    `
      <p>For the next few minutes, you don't have to accomplish anything.</p>

      <ul>
        <li>Get somewhere comfortable</li>
        <li>Put down anything that can wait</li>
        <li>Take a few slow breaths</li>
        <li>Close your eyes if that feels comfortable</li>
        <li>Give yourself permission to simply be</li>
      </ul>

      <p><strong>Nothing needs to be solved right now.</strong></p>
    `
  );

});


closeContentButton.addEventListener("click", function () {

  resetContent.style.display = "none";

  resetOptions.style.display = "block";

});

  </script></body>
</html>
