<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeReset - Down Reset</title>
  <link rel="stylesheet" href="style.css">
</head><body> <header>
    <div class="logo">LifeReset</div>
    <div class="tagline">You don't have to figure everything out alone.</div>
  </header> <main>
    <section class="welcome-card"> <h1>🌧️ Here's Your Reset</h1>

  <p>
    You don't have to fix everything right now.
    Let's focus on one small step that can make this moment
    a little easier.
  </p>

  <h2>What do you need right now?</h2>

  <button onclick="alert('Take a slow breath in. Hold it gently. Then breathe out slowly. Give yourself a moment.')">
    🌬️ Take a Breathing Break
  </button>
<button id="getItOffMyMindButton">
  📝 Get It Off My Mind
</button>

  <button onclick="alert('Choose one tiny thing you can do right now. Drink some water, take a shower, step outside, or simply get comfortable.')">
    🌱 Do One Small Thing
  </button>

  <button onclick="alert('A little movement can help shift the moment. Stretch, walk around, dance, or move however feels comfortable.')">
    🚶 Move My Body
  </button>

  <button id="reachOutButton">
  ❤️ Reach Out
</button>

  <button id="restButton">
  🛌 Give Myself Permission to Rest
</button>
    </section>  
  </main>  
  <script>
  const getItOffMyMindButton = document.getElementById("getItOffMyMindButton");
  const reachOutButton = document.getElementById("reachOutButton");

  getItOffMyMindButton.addEventListener("click", function () {
    alert("You can write whatever is on your mind. You don't have to make it perfect or explain everything.");
  });

  reachOutButton.addEventListener("click", function () {
    alert("You don't have to handle everything alone. Consider reaching out to someone you trust.");
  });
</script>
  </body>
</html>
