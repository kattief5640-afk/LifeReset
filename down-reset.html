/* =========================
   LANGUAGE
========================= */

const language =
  localStorage.getItem("lifeResetLanguage") || "en";

const t =
  translations[language] || translations.en;

document.documentElement.lang = language;


/* =========================
   PUT TRANSLATIONS ON PAGE
========================= */

document.getElementById("tagline").textContent = t.tagline;
document.getElementById("resetHeading").textContent = t.heading;
document.getElementById("resetIntro").textContent = t.intro;
document.getElementById("resetQuestion").textContent = t.question;

document.getElementById("breathingButton").textContent = t.breathing;
document.getElementById("journalButton").textContent = t.journal;
document.getElementById("smallThingButton").textContent = t.smallThing;
document.getElementById("movementButton").textContent = t.movement;
document.getElementById("reachOutButton").textContent = t.reachOut;
document.getElementById("restButton").textContent = t.rest;
document.getElementById("closeContentButton").textContent = t.back;


/* =========================
   ELEMENTS
========================= */

const resetOptions = document.querySelector(".reset-options");
const resetContent = document.getElementById("resetContent");
const contentTitle = document.getElementById("contentTitle");
const contentText = document.getElementById("contentText");
const contentArea = document.getElementById("contentArea");


function showContent(title, text, content) {

  resetOptions.style.display = "none";
  resetContent.style.display = "block";

  contentTitle.textContent = title;
  contentText.textContent = text;
  contentArea.innerHTML = content;
}


/* =========================
   BREATHING
========================= */

document.getElementById("breathingButton")
.addEventListener("click", function () {

  showContent(
    t.breathingTitle,
    t.breathingText,
    `
      <h2 id="breathingTimer">${t.breathingReady}</h2>

      <p id="breathingInstruction">
        ${t.breathingInstruction}
      </p>

      <button id="startBreathingButton">
        ${t.startBreathing}
      </button>
    `
  );

  document.getElementById("startBreathingButton")
    .addEventListener("click", startBreathing);

});


function startBreathing() {

  const timer =
    document.getElementById("breathingTimer");

  const instruction =
    document.getElementById("breathingInstruction");

  const button =
    document.getElementById("startBreathingButton");

  button.style.display = "none";

  let step = 0;

  const breathingSteps = [
    [t.breatheIn, 4],
    [t.hold, 4],
    [t.breatheOut, 6]
  ];

  function nextStep() {

    if (step >= breathingSteps.length) {

      timer.textContent = t.done;
      instruction.textContent = t.breathingDone;

      return;
    }

    const currentStep = breathingSteps[step];

    instruction.textContent = currentStep[0];

    let seconds = currentStep[1];

    timer.textContent = seconds;

    const countdown = setInterval(function () {

      seconds--;

      timer.textContent = seconds;

      if (seconds <= 0) {

        clearInterval(countdown);

        step++;

        nextStep();

      }

    }, 1000);

  }

  nextStep();

}


/* =========================
   JOURNAL
========================= */

document.getElementById("journalButton")
.addEventListener("click", function () {

  showContent(
    t.journalTitle,
    t.journalText,
    `
      <textarea
        id="journalInput"
        rows="8"
        placeholder="${t.journalPlaceholder}"
      ></textarea>

      <button id="saveJournalButton">
        ${t.saveEntry}
      </button>

      <p id="journalMessage"></p>
    `
  );

  document.getElementById("saveJournalButton")
  .addEventListener("click", function () {

    const input =
      document.getElementById("journalInput");

    const message =
      document.getElementById("journalMessage");

    const entry =
      input.value.trim();

    if (entry === "") {

      message.textContent = t.journalEmpty;
      return;

    }

    localStorage.setItem("lifeResetJournal", entry);

    message.textContent = t.journalSaved;

  });

});

});


/* =========================

========================= */

document.getElementById("closeContentButton")
.addEventListener("click", function () {

  resetContent.style.display = "none";
  resetOptions.style.display = "block";

});

</script>
